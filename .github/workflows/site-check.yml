name: Website-Checks
on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript-Syntax prüfen
        run: node --check assets/js/main.js
      - name: Rechner, Seiten und Links testen
        run: node --test tests/site.test.cjs
