name: Website-Checks
on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript-Syntax prüfen
        run: node --check assets/js/main.js
      - name: Rechner, Seiten und Links testen
        run: node --test tests/site.test.cjs
      - name: Browser-Testwerkzeuge installieren
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Browser-Funktionen auf Smartphone testen
        run: node tests/browser.cjs
      - name: Screenshots zur Sichtprüfung speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
